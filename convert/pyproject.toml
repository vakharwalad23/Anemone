[project]
name = "anemone-convert"
version = "0.1.0"
description = "Turn a Hugging Face LLM into an Anemone model folder"
requires-python = ">=3.12,<3.14"
dependencies = [
    "huggingface-hub>=1.0",
    "numpy>=2.0",
    "safetensors>=0.6",
    "torch==2.9.0",
]

[project.optional-dependencies]
export = [
    "coreai-models",
    "mlx-lm>=0.32",
    "transformers>=5.0",
]

[tool.uv.sources]
coreai-models = { git = "https://github.com/apple/coreai-models", rev = "9e120659a5643ad77f09125ba75eb6c9291e6ef4", subdirectory = "python" }

[tool.ruff]
line-length = 140

[project.scripts]
anemone-convert = "anemone_convert.__main__:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
